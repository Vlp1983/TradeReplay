name: Auto-merge Claude branches
on:
  push:
    branches:
      - 'claude/**'
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "Auto: ${{ github.ref_name }}" \
            --body "Automated merge of Claude changes" \
            || true
          gh pr merge ${{ github.ref_name }} \
            --merge \
            --auto \
            --delete-branch
